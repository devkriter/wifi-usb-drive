<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width" />
  <title>ESP32 USB File Server</title>
  <link href="/styles.css" rel="stylesheet" />

  <script>
    function getPath() {
      const pathname = window.location.pathname;
      return pathname;
    }
    async function deleteFile(filepath) {
    try {
      const deleteResponse = await fetch(`/delete${filepath}`, { method: 'POST' });
      if (![200, 303].includes(deleteResponse.status)) {
        alert('Failed to delete the file.');
        return;
      }
      location.reload();
    } catch (error) {
      console.error('Error occurred:', error);
      alert('An error occurred while processing your request.');
    }
  }
  </script>
</head>

  <span id="st-owner">Card: ...</span>
  <span id="st-card"></span>
  <span id="st-net"></span>
  <button id="edit-toggle" class="button edit-button">Edit mode</button>
</div>
<script>
  async function refreshStatus() {
    try {
      const r = await fetch('/api/status', { cache: 'no-store' });
      const s = await r.json();
      const owner = s.owner === 'app' ? (s.sticky ? 'WiFi side (edit mode)' : 'WiFi side')
                  : s.owner === 'usb' ? 'USB host'
                  : s.owner === 'pending' ? 'waiting for USB to go idle' : 'no card';
      document.getElementById('st-owner').textContent = 'Card: ' + owner;
      document.getElementById('st-card').textContent = s.card
        ? (s.free_bytes / 1073741824).toFixed(2) + ' GB free of ' + (s.total_bytes / 1073741824).toFixed(2) + ' GB'
        : 'no card';
      document.getElementById('st-net').textContent = s.ip + ' (' + s.rssi + ' dBm)';
      document.getElementById('edit-toggle').textContent = s.sticky ? 'Leave edit mode' : 'Edit mode';
      window.wdSticky = !!s.sticky;
    } catch (e) {}
  }
  document.getElementById('edit-toggle').addEventListener('click', async () => {
    await fetch('/api/owner?mode=' + (window.wdSticky ? 'auto' : 'app'), { method: 'POST' });
    setTimeout(refreshStatus, 400);
  });
  refreshStatus();
  setInterval(refreshStatus, 2000);
</script>
